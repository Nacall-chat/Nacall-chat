<!-- Supabase: Authentication > Email Templates > Reset Password. Assunto sugerido: "Recuperação de senha NACALL" -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;background:#14181F;color:#E8ECF2;border-radius:16px">
  <h2 style="margin:0 0 8px;color:#8FE3B0">Recuperar senha</h2>
  <p style="margin:0 0 16px">Use este código para criar uma nova senha:</p>
  <p style="margin:0 0 16px;font-size:34px;letter-spacing:10px;font-weight:700;text-align:center;color:#7FD6E8">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#B8BFCC;font-size:14px">O código vale por 10 minutos e só funciona uma vez. Se você não pediu, ignore este email: sua senha continua a mesma.</p>
  <p style="margin:0;color:#B8BFCC;font-size:14px">Nunca compartilhe este código com ninguém.</p>
</div>
