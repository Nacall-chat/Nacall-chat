<!-- Supabase: Authentication > Email Templates > Confirm signup. Assunto sugerido: "Seu código NACALL" -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;background:#14181F;color:#E8ECF2;border-radius:16px">
  <h2 style="margin:0 0 8px;color:#8FE3B0">Bem-vindo ao NACALL</h2>
  <p style="margin:0 0 16px">Use este código para confirmar seu email:</p>
  <p style="margin:0 0 16px;font-size:34px;letter-spacing:10px;font-weight:700;text-align:center;color:#7FD6E8">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#B8BFCC;font-size:14px">O código vale por 10 minutos e só funciona uma vez. Se não foi você, ignore este email.</p>
  <p style="margin:0;color:#B8BFCC;font-size:14px">Nunca compartilhe este código com ninguém.</p>
</div>
