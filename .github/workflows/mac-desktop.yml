name: Desktop · Build macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/mac-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/mac-desktop.yml'
permissions:
  contents: read
jobs:
  mac-dmg:
    name: Compilar .dmg (Apple Silicon e Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependências desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validar segurança e sintaxe
        working-directory: desktop
        run: npm run check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Preparar ícone
        run: |
          python -m pip install "Pillow==11.3.0"
          python desktop/scripts/make_icon.py
      - name: Compilar o app (arm64 e x64)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Assinar sem certificado (ad-hoc) e gerar os .dmg
        working-directory: desktop
        run: bash scripts/package-mac.sh
      - name: Abrir o app e medir a memória (teste rápido)
        working-directory: desktop
        run: bash scripts/smoke-mac.sh dist/mac-arm64/NACALL.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NACALL-macOS-v0.1.0
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
