name: Deploy Homologação
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: homologacao
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  DOMINIO_HOMOLOGACAO: ${{ vars.DOMINIO_HOMOLOGACAO || 'nacall-homologacao.vercel.app' }}
jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack vercel@64.3.1
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: publicar
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          vercel alias set "$url" "$DOMINIO_HOMOLOGACAO" --token=${{ secrets.VERCEL_TOKEN }}
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Pedir aprovação para produção
        uses: actions/github-script@v8
        env:
          URL_DEPLOY: ${{ steps.publicar.outputs.url }}
        with:
          script: |
            const label = 'deploy-producao';
            const sha = context.sha;
            await github.rest.issues.getLabel({ ...context.repo, name: label }).catch(() =>
              github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205', description: 'Aguardando aprovação para produção' }));
            const abertas = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, labels: label, state: 'open' });
            for (const issue of abertas) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Substituído pelo deploy de \`${sha.slice(0, 7)}\`.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' });
            }
            const commit = context.payload.head_commit?.message?.split('\n')[0] ?? sha.slice(0, 7);
            await github.rest.issues.create({
              ...context.repo,
              title: `Aprovar produção: ${commit}`,
              labels: [label],
              body: [
                `A versão \`${sha.slice(0, 7)}\` está em homologação.`,
                '',
                `- Homologação: https://${process.env.DOMINIO_HOMOLOGACAO}`,
                `- Deploy desta versão: ${process.env.URL_DEPLOY}`,
                `- Commit: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`,
                '',
                'Teste em homologação e comente **aprovado** para liberar ou **negado** para cancelar.',
                'A produção só é publicada quando todos os aprovadores comentarem **aprovado**.',
                '',
                `<!-- sha:${sha} -->`,
              ].join('\n'),
            });
