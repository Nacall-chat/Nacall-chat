name: Build NACALL Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    name: Compilar .exe (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validar segurança e sintaxe
        working-directory: desktop
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ícone Jacall para Windows
        run: |
          python -m pip install "Pillow==11.3.0"
          python desktop/scripts/make_icon.py
      - name: Compilar instalador e portable
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: NACALL-Windows-x64-v0.1.0
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
