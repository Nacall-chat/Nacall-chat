name: Desktop · Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    name: Compilar .exe (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependências desktop
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validar segurança e sintaxe
        working-directory: desktop
        run: npm run check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Preparar ícone Jacall para Windows
        run: |
          python -m pip install "Pillow==11.3.0"
          python desktop/scripts/make_icon.py
      - name: Compilar instalador e portable
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NACALL-Windows-x64-v0.1.0
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Publicar instalador no repositório de downloads
    # Só da main: o app abre o site de produção. Publica no repositório PÚBLICO Nacall-chat/nacall-downloads (o do código é
    # privado), de onde sai o botão "Download Windows" do site. Precisa do secret DOWNLOADS_TOKEN: um token com permissão de
    # escrita só naquele repositório (docs/DEPLOY.md). Sem ele, só avisa e não falha.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows-exe
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: desktop/package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NACALL-Windows-x64-v0.1.0
          path: dist
      - name: Publicar a versão nova
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DOWNLOADS_REPO: Nacall-chat/nacall-downloads
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Secret DOWNLOADS_TOKEN não cadastrado: o instalador NÃO foi publicado (ver docs/DEPLOY.md)."; exit 0; fi
          SETUP=$(ls dist/NACALL-Setup-*.exe | head -1)
          if [ -z "$SETUP" ]; then echo "::error::Instalador não encontrado no artefato."; exit 1; fi
          # Nome fixo: o link .../releases/latest/download/NACALL-Setup-x64.exe do site sempre pega a versão mais nova.
          cp "$SETUP" dist/NACALL-Setup-x64.exe
          (cd dist && sha256sum NACALL-Setup-x64.exe > NACALL-Setup-x64.exe.sha256)
          VERSION=$(jq -r .version desktop/package.json)
          TAG="desktop-v${VERSION}-${GITHUB_RUN_NUMBER}"
          {
            echo "NACALL para Windows ${VERSION} (build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})."
            echo
            echo "Instalador de teste, ainda sem assinatura digital: o Windows pode mostrar \"O Windows protegeu o computador\"."
            echo "Clique em \"Mais informações\" e depois em \"Executar assim mesmo\"."
            echo
            echo "SHA-256: $(cut -d' ' -f1 dist/NACALL-Setup-x64.exe.sha256)"
          } > notes.md
          gh release create "$TAG" dist/NACALL-Setup-x64.exe dist/NACALL-Setup-x64.exe.sha256 --repo "$DOWNLOADS_REPO" --title "NACALL para Windows ${VERSION}" --notes-file notes.md --latest
          echo "Publicado: https://github.com/${DOWNLOADS_REPO}/releases/tag/${TAG}"
