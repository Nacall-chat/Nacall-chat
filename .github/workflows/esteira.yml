name: Esteira
on:
  push:
    branches: [release, main]
concurrency:
  group: esteira-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
  homologacao:
    name: HML
    needs: verificar
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.HML_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.HML_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.HML_VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir credenciais da Vercel (HML)
        run: |
          for n in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret HML_$n não cadastrado em Settings > Secrets and variables > Actions."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack vercel@64.3.1
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  producao:
    name: PRD
    # A aprovação é a revisão do PR release -> main: o merge na main publica em produção.
    if: github.ref == 'refs/heads/main'
    needs: homologacao
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir credenciais da Vercel (PRD)
        run: |
          for n in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n (produção) não cadastrado em Settings > Secrets and variables > Actions. Nada foi publicado em produção."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack vercel@64.3.1
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
