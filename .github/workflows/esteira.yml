name: Esteira
on:
  push:
    branches: [release, main]
  workflow_dispatch:
concurrency:
  group: esteira-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
  homologacao:
    name: HML
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: verificar
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.HML_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.HML_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.HML_VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir credenciais da Vercel (HML)
        run: |
          for n in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret HML_$n não cadastrado em Settings > Secrets and variables > Actions."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack vercel@64.3.1
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  producao:
    name: PRD
    # Publicação automática após a verificação da main; execução manual permanece disponível.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verificar
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.PRD_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.PRD_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.PRD_VERCEL_PROJECT_ID }}
    steps:
      - name: Conferir que é a main e que há credenciais
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Produção só é publicada a partir da branch main (selecionada: $GITHUB_REF). Nada foi publicado."; exit 1; fi
          for n in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!n}" ]; then echo "::error::Credencial $n (produção) não cadastrada em Settings > Secrets and variables > Actions. Nada foi publicado."; exit 1; fi
          done
          if [ "$VERCEL_PROJECT_ID" != "prj_kJhez0IKGKvTGrsrwxH6rL2ZIQMT" ]; then echo "::error::Projeto PRD_VERCEL_PROJECT_ID não corresponde ao NACALL PRD. Publicação cancelada."; exit 1; fi
          if [ "$VERCEL_ORG_ID" != "team_0m3biijv5SSsYVljvDPNFAfM" ]; then echo "::error::PRD_VERCEL_ORG_ID não corresponde à equipe NACALL. Publicação cancelada."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@64.3.1
      # O build roda na Vercel, que lê as variáveis de produção (inclusive as sensitive).
      - run: vercel deploy --prod --token="$VERCEL_TOKEN"
